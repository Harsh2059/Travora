android.builtInKotlin=false
android.newDsl=false
android.useAndroidX=true
# Jetifier is NOT needed: all deps (appcompat, core-ktx) are already AndroidX.
# Enabling it caused OOM when transforming Flutter engine JARs.
android.enableJetifier=false
# Increase Gradle daemon heap to avoid OOM during dependency resolution
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
